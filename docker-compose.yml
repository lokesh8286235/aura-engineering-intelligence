services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./apps/api:/app"]
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./apps/web:/app"]
    command: sh -c "npm install && npm run dev"
    ports: ["3000:3000"]
    depends_on: [api]
